version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # mcp 2.x moved FastMCP; moving to it is a deliberate migration, not a bump
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: "/deploy/cloudflare"
    schedule:
      interval: monthly
    groups:
      cloudflare:
        patterns: ["*"]
