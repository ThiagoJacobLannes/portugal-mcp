# Daily check against the real public APIs. Sources change formats without notice;
# when a check fails, an issue is opened (or updated) so it gets fixed quickly.
name: Live sources

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Live checks
        id: live
        shell: bash  # runs with -eo pipefail, so a failing pytest fails the step despite tee
        run: python -m pytest -m live -q -rf --maxfail=50 2>&1 | tee live.txt
        continue-on-error: true
      - name: Open or update an issue when a source broke
        if: steps.live.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```'
            grep -E '^(FAILED|ERROR)' live.txt | head -40
            echo '```'
          } > body.md
          num=$(gh issue list --state open --label live-check --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body-file body.md
          else
            gh label create live-check --color B60205 --force >/dev/null
            gh issue create --title "Live source check failing" --label live-check --body-file body.md
          fi
          exit 1
